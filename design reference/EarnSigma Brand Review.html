<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ─── design tokens ─────────────────────────────────────────────────
const T = {
  bg: '#071225', bgElevated: '#0c1933', panel: '#102043', panelMuted: '#132950',
  border: 'rgba(148,163,184,0.28)', borderStrong: 'rgba(96,165,250,0.38)',
  text: '#eaf1ff', textSec: '#b9c7e8', textMuted: '#8ea2cc',
  blue: '#3b82f6', teal: '#2fd9c5', emerald: '#34d399',
};

// Mini sparkline component
function Sparkline({ data, color = '#2fd9c5', width = 120, height = 40 }) {
  const min = Math.min(...data), max = Math.max(...data);
  const range = max - min || 1;
  const pts = data.map((v, i) => {
    const x = (i / (data.length - 1)) * width;
    const y = height - ((v - min) / range) * (height - 6) - 3;
    return `${x},${y}`;
  }).join(' ');
  const area = `0,${height} ` + pts + ` ${width},${height}`;
  return (
    <svg width={width} height={height} style={{ display: 'block' }}>
      <defs>
        <linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.3" />
          <stop offset="100%" stopColor={color} stopOpacity="0" />
        </linearGradient>
      </defs>
      <polygon points={area} fill="url(#sg)" />
      <polyline points={pts} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
    </svg>
  );
}

// Donut score ring
function ScoreRing({ score = 72, size = 96, color = '#2fd9c5' }) {
  const r = (size - 10) / 2;
  const circ = 2 * Math.PI * r;
  const dash = (score / 100) * circ;
  return (
    <svg width={size} height={size} style={{ display: 'block' }}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="rgba(148,163,184,0.15)" strokeWidth="7" />
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth="7"
        strokeDasharray={`${dash} ${circ - dash}`} strokeLinecap="round"
        transform={`rotate(-90 ${size/2} ${size/2})`} />
      <text x={size/2} y={size/2 + 7} textAnchor="middle" fill="#eaf1ff" fontSize="20" fontWeight="600" fontFamily="Inter,sans-serif">{score}</text>
    </svg>
  );
}

// Mini bar chart
function MiniBar({ data, color = '#3b82f6' }) {
  const max = Math.max(...data);
  return (
    <div style={{ display: 'flex', alignItems: 'flex-end', gap: 3, height: 32 }}>
      {data.map((v, i) => (
        <div key={i} style={{
          flex: 1, background: i === data.length - 1 ? color : `${color}55`,
          borderRadius: 3, height: `${(v / max) * 100}%`, minHeight: 3,
          transition: 'height 0.3s'
        }} />
      ))}
    </div>
  );
}

// Badge
function Badge({ variant = 'neutral', children }) {
  const styles = {
    good: { bg: 'rgba(52,211,153,0.15)', border: 'rgba(52,211,153,0.35)', color: '#34d399' },
    warn: { bg: 'rgba(251,191,36,0.13)', border: 'rgba(251,191,36,0.3)', color: '#fbbf24' },
    neutral: { bg: 'rgba(148,163,184,0.12)', border: 'rgba(148,163,184,0.25)', color: '#b9c7e8' },
    blue: { bg: 'rgba(59,130,246,0.15)', border: 'rgba(59,130,246,0.35)', color: '#3b82f6' },
  };
  const s = styles[variant] || styles.neutral;
  return (
    <span style={{
      display: 'inline-flex', alignItems: 'center',
      padding: '2px 10px', borderRadius: 999,
      fontSize: 10, fontWeight: 600, letterSpacing: '0.1em', textTransform: 'uppercase',
      background: s.bg, border: `1px solid ${s.border}`, color: s.color,
    }}>{children}</span>
  );
}

// ─── APP SHELL / DASHBOARD ─────────────────────────────────────────
const revenueData = [4200, 4800, 4500, 5100, 4900, 5400, 5800, 6100, 5900, 6400, 6800, 7200];

    }}>
      <div style={{ flex: 1, minWidth: 240 }}>
        <p style={{ fontSize: 10, fontWeight: 700, letterSpacing: '0.2em', textTransform: 'uppercase', color: T.teal, marginBottom: 8 }}>Next best move</p>
        <p style={{ fontSize: 15, fontWeight: 600, color: T.text, lineHeight: 1.45 }}>
          {empty ? 'Upload your latest exports to initialize baseline trend analysis.' : 'Pitch a sponsorship renewal before May — your Q2 engagement window is opening.'}
        </p>
        <p style={{ fontSize: 12, color: T.textSec, marginTop: 6, lineHeight: 1.6 }}>
          {empty ? 'Upload a supported platform export to start.' : 'Based on your audience growth trend and the 14-week gap since last brand deal.'}
        </p>
      </div>
      {!empty && (
        <button style={{
          padding: '9px 20px', borderRadius: 999, fontSize: 12, fontWeight: 600,
          background: T.blue, border: 'none', color: '#fff', cursor: 'pointer',
          boxShadow: '0 0 20px rgba(59,130,246,0.3)', fontFamily: 'Inter, sans-serif', whiteSpace: 'nowrap',
        }}>See full breakdown</button>
      )}
    </article>
  );
}

function RevenueTrend({ empty }) {
  if (empty) return (
    <article style={{
      background: 'rgba(16,32,67,0.55)', border: `1px solid ${T.border}`,
      borderRadius: '1.3rem', padding: 24,
    }}>
      <p style={{ fontSize: 10, fontWeight: 600, letterSpacing: '0.15em', textTransform: 'uppercase', color: T.textMuted, marginBottom: 6 }}>Revenue trend</p>
      <p style={{ fontSize: 12, color: T.textSec, lineHeight: 1.6 }}>Revenue trend will appear here after your first completed report.</p>
    </article>
  );

  const max = Math.max(...revenueData);
  const min = Math.min(...revenueData);
  const W = 560, H = 120;
  const pts = revenueData.map((v, i) => {
    const x = 10 + (i / (revenueData.length - 1)) * (W - 20);
    const y = H - 10 - ((v - min) / (max - min)) * (H - 24);
    return [x, y];
  });
  const polyline = pts.map(p => p.join(',')).join(' ');
  const area = `10,${H} ` + polyline + ` ${W - 10},${H}`;

  return (
    <article style={{
      background: 'linear-gradient(145deg,rgba(16,32,67,0.95),rgba(19,41,80,0.92),rgba(16,32,67,0.96))',
      border: `1px solid ${T.borderStrong}`,
      borderRadius: '1.3rem', padding: 24,
    }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 16, flexWrap: 'wrap', gap: 8 }}>
        <div>
          <p style={{ fontSize: 10, fontWeight: 600, letterSpacing: '0.15em', textTransform: 'uppercase', color: T.textMuted }}>Revenue trend</p>
          <p style={{ fontSize: 20, fontWeight: 600, color: T.text, marginTop: 4, letterSpacing: '-0.02em' }}>$7,200 <span style={{ fontSize: 12, color: T.emerald, fontWeight: 500 }}>↑ +5.9% vs Mar</span></p>
        </div>
        <p style={{ fontSize: 11, color: T.textMuted }}>12-month rolling</p>
      </div>
      <svg viewBox={`0 0 ${W} ${H}`} style={{ width: '100%', height: 'auto', display: 'block' }}>
        <defs>
          <linearGradient id="tg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor="#2fd9c5" stopOpacity="0.25" />
            <stop offset="100%" stopColor="#2fd9c5" stopOpacity="0" />
          </linearGradient>
        </defs>
        <polygon points={area} fill="url(#tg)" />
        <polyline points={polyline} fill="none" stroke="#2fd9c5" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
        {pts.map(([x, y], i) => (
          <circle key={i} cx={x} cy={y} r={i === pts.length - 1 ? 4 : 0} fill="#2fd9c5" />
        ))}
      </svg>
      <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 8 }}>
        {months.map((m, i) => (
          <span key={i} style={{ fontSize: 9, color: T.textMuted, textAlign: 'center', flex: 1 }}>{m}</span>
        ))}
      </div>
    </article>
  );
}

function UtilityRow({ empty }) {
  const tiles = [
    { label: 'Plan', value: 'Pro', sub: 'Active', badge: 'good' },
    { label: 'Platforms connected', value: empty ? '—' : '3', sub: empty ? 'None yet' : 'YouTube · Patreon · Gumroad' },
    { label: 'Data coverage', value: empty ? '—' : '12 months', sub: empty ? 'After first report' : 'Jan 2024 – Apr 2025' },
    { label: 'Last upload', value: empty ? '—' : 'Apr 08', sub: empty ? 'No uploads yet' : '2025' },
  ];
  return (
    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 10 }}>
      {tiles.map((t, i) => (
        <article key={i} style={{
          background: 'rgba(16,32,67,0.55)', border: `1px solid ${T.border}`,
          borderRadius: '1.1rem', padding: '14px 16px',
        }}>
          <p style={{ fontSize: 10, fontWeight: 600, letterSpacing: '0.14em', textTransform: 'uppercase', color: T.textMuted, marginBottom: 6 }}>{t.label}</p>
          <div style={{ display: 'flex', alignItems: 'center', gap: 7 }}>
            <p style={{ fontSize: 17, fontWeight: 600, color: T.text }}>{t.value}</p>
            {t.badge && <Badge variant={t.badge}>{t.sub.split(' ')[0]}</Badge>}
          </div>
          {!t.badge && <p style={{ fontSize: 11, color: T.textMuted, marginTop: 3 }}>{t.sub}</p>}
        </article>
      ))}
    </div>
  );
}

// ─── MAIN APP ─────────────────────────────────────────────────────
function App() {
  const [mode, setMode] = useState('earn');
  const [empty, setEmpty] = useState(false);
  const [accent, setAccent] = useState('teal');
  const [showReview, setShowReview] = useState(true);
  const [tweaksOpen, setTweaksOpen] = useState(false);

  // Tweaks panel wiring
  useEffect(() => {
    const listener = (e) => {
      if (e.data?.type === '__activate_edit_mode') setTweaksOpen(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweaksOpen(false);
    };
    window.addEventListener('message', listener);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', listener);
  }, []);

  // Wire tweaks buttons
  useEffect(() => {
    function wire(id, setter) {
      const el = document.getElementById(id);
      if (!el) return;
      el.querySelectorAll('.tweak-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          el.querySelectorAll('.tweak-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          setter(btn.dataset.val);
        });
      });
    }
    wire('tweak-mode', setMode);
    wire('tweak-data', (v) => setEmpty(v === 'empty'));
    wire('tweak-accent', setAccent);
    wire('tweak-review', (v) => setShowReview(v === 'show'));
    const panel = document.getElementById('tweaks-panel');
    if (panel) panel.classList.toggle('active', tweaksOpen);
  }, [tweaksOpen]);

  const accentColor = accent === 'violet' ? '#a78bfa' : accent === 'blue' ? T.blue : T.teal;

  return (
    <div style={{ display: 'flex', height: '100vh', overflow: 'hidden' }}>
      {/* Sidebar nav */}
      <nav style={{
        width: 220, flexShrink: 0,
        background: 'linear-gradient(180deg, #0a1628 0%, #071225 100%)',
        borderRight: `1px solid ${T.border}`,
        display: 'flex', flexDirection: 'column',
        padding: '20px 0',
      }}>
        {/* Logo */}
        <div style={{ padding: '0 20px 24px', borderBottom: `1px solid ${T.border}` }}>
          <img src="assets/earnsigma-lockup-transparent.png" alt="EarnSigma" style={{ width: 140, height: 'auto' }} />
        </div>

        {/* Nav links */}
        <div style={{ padding: '16px 12px', flex: 1 }}>
          {[
            { label: 'Dashboard', active: true },
            { label: 'Reports' },
            { label: 'Data' },
            { label: 'Upload' },
            { label: 'Settings' },
          ].map((l) => (
            <div key={l.label} style={{
              padding: '8px 12px', borderRadius: 999, marginBottom: 2,
              fontSize: 13, fontWeight: l.active ? 600 : 400,
              color: l.active ? T.text : T.textMuted,
              background: l.active ? 'linear-gradient(135deg,rgba(59,130,246,0.18),rgba(47,217,197,0.12))' : 'transparent',
              border: l.active ? `1px solid ${T.borderStrong}` : '1px solid transparent',
              cursor: 'pointer',
            }}>{l.label}</div>
          ))}
        </div>

        {/* Plan badge bottom */}
        <div style={{ padding: '0 12px' }}>
          <div style={{
            padding: '12px 14px', borderRadius: '1rem',
            background: 'rgba(16,32,67,0.6)', border: `1px solid ${T.border}`,
          }}>
            <p style={{ fontSize: 10, fontWeight: 700, letterSpacing: '0.15em', textTransform: 'uppercase', color: T.textMuted, marginBottom: 4 }}>Plan</p>
            <p style={{ fontSize: 13, fontWeight: 600, color: T.text }}>Pro</p>
            <p style={{ fontSize: 11, color: T.textMuted }}>Active · Renews May 1</p>
          </div>
        </div>
      </nav>

      {/* Main content */}
      <main style={{ flex: 1, overflowY: 'auto', padding: '28px 28px', background: `radial-gradient(circle at 14% -8%, rgba(59,130,246,0.15) 0%, rgba(59,130,246,0) 48%), radial-gradient(circle at 92% 8%, rgba(47,217,197,0.06) 0%, rgba(47,217,197,0) 44%), ${T.bg}` }}>
        <div style={{ maxWidth: 860, margin: '0 auto', display: 'flex', flexDirection: 'column', gap: 14 }}>
          <DashHeader mode={mode} setMode={setMode} empty={empty} />
          <NextBestMove empty={empty} />
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 14 }}>
            <CreatorHealthCard score={72} empty={empty} />
            <SignalsPanel empty={empty} />
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 14 }}>
            <KpiTile label="Net Revenue" value="$7,200" delta="+5.9%" spark={revenueData.slice(-8)} accent={accentColor} />
            <KpiTile label="Subscribers" value="14,820" delta="+2.1%" spark={[8200,9100,9600,10200,11400,12800,13600,14820]} accent={accentColor} />
            <KpiTile label="Stability Index" value="78" delta="+3 pts" spark={[62,65,68,71,69,72,75,78]} accent={accentColor} />
          </div>
          <RevenueTrend empty={empty} />
          <UtilityRow empty={empty} />
        </div>
      </main>

      {/* Brand review panel */}
      <BrandReviewPanel visible={showReview} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
